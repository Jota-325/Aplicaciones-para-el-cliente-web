<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registro de Estudiantes</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body>
  <main class="contenedor">
    <h1>Registro de Estudiantes</h1>
    <p id="aviso" class="aviso" hidden></p>

    <form id="formularioEstudiante" novalidate>
      <div class="campo"><label for="cedula">Cédula</label><input type="text" id="cedula" maxlength="10" inputmode="numeric" placeholder="Ej: 1710034065"><small class="error" id="errorCedula"></small></div>
      <div class="campo"><label for="apellidos">Apellidos</label><input type="text" id="apellidos" placeholder="Ej: Pérez Gómez"><small class="error" id="errorApellidos"></small></div>
      <div class="campo"><label for="nombres">Nombres</label><input type="text" id="nombres" placeholder="Ej: Juan Carlos"><small class="error" id="errorNombres"></small></div>
      <div class="campo"><label for="direccion">Dirección</label><input type="text" id="direccion" placeholder="Ej: Av. Amazonas N24-15"><small class="error" id="errorDireccion"></small></div>
      <div class="campo"><label for="telefono">Teléfono</label><input type="text" id="telefono" maxlength="10" inputmode="numeric" placeholder="Ej: 0991234567"><small class="error" id="errorTelefono"></small></div>
      <div class="campo"><label for="correo">Correo electrónico</label><input type="text" id="correo" placeholder="Ej: estudiante@correo.com"><small class="error" id="errorCorreo"></small></div>
      <div class="campo"><label for="facultad">Facultad</label>
        <select id="facultad">
          <option value="">Seleccione una facultad</option>
          <option value="Ingeniería">Ingeniería</option>
          <option value="Ciencias Administrativas">Ciencias Administrativas</option>
          <option value="Ciencias de la Salud">Ciencias de la Salud</option>
          <option value="Ciencias de la Educación">Ciencias de la Educación</option>
        </select><small class="error" id="errorFacultad"></small></div>
      <div class="campo"><label for="nivel">Nivel</label>
        <select id="nivel">
          <option value="">Seleccione un nivel</option>
          <option value="1">Primer nivel</option><option value="2">Segundo nivel</option>
          <option value="3">Tercer nivel</option><option value="4">Cuarto nivel</option>
          <option value="5">Quinto nivel</option><option value="6">Sexto nivel</option>
          <option value="7">Séptimo nivel</option><option value="8">Octavo nivel</option>
          <option value="9">Noveno nivel</option><option value="10">Décimo nivel</option>
        </select><small class="error" id="errorNivel"></small></div>
      <div class="campo"><label for="paralelo">Paralelo</label>
        <select id="paralelo">
          <option value="">Seleccione un paralelo</option>
          <option value="A">A</option><option value="B">B</option><option value="C">C</option>
        </select><small class="error" id="errorParalelo"></small></div>
      <div class="botones">
        <button type="submit" id="btnGuardar">Guardar estudiante</button>
        <button type="button" id="btnLimpiar">Limpiar formulario</button>
      </div>
    </form>

    <p id="mensaje"></p>

    <h2>Estudiantes registrados (<span id="contador">0</span>)</h2>
    <div class="tabla-contenedor">
      <table>
        <thead><tr><th>Cédula</th><th>Apellidos</th><th>Nombres</th><th>Dirección</th><th>Teléfono</th><th>Correo</th><th>Facultad</th><th>Nivel</th><th>Paralelo</th><th>Acción</th></tr></thead>
        <tbody id="tablaEstudiantes"></tbody>
      </table>
    </div>

    <h2>JSON guardado en localStorage</h2>
    <pre id="visorJson">[]</pre>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
